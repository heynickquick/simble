services:
  # Caddy removed — using existing system nginx with certbot for SSL.
  # Run deploy/setup-nginx.sh on the VPS to set up the vhost.

  textbee-api:
    build: ./textbee/api
    restart: unless-stopped
    env_file: .env
    networks: [internal]
    depends_on:
      - mongodb
    environment:
      - PORT=3001
    ports:
      - "3010:3001"  # host:3010 → textbee-api:3001
    expose:
      - "3001"

  textbee-web:
    build: ./textbee/web
    restart: unless-stopped
    env_file: .env
    networks: [internal]
    ports:
      - "3020:3000"  # host:3020 → textbee-web:3000
    expose:
      - "3000"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    expose:
      - "27017"

  campaign-manager:
    build: ./services/campaign-manager
    restart: unless-stopped
    env_file: ./services/campaign-manager/.env
    networks: [internal]
    depends_on:
      - mongodb
    ports:
      - "4000:4000"  # Direct access for testing. Use Caddy for prod.
    expose:
      - "4000"

  web:
    build: ./web
    restart: unless-stopped
    networks: [internal]
    ports:
      - "8880:8080"  # Direct access for testing without a domain. Use Caddy for prod.
    expose:
      - "8080"

  watchdog:
    build: ./services/watchdog
    restart: unless-stopped
    env_file: ./services/watchdog/.env
    networks: [internal]
    depends_on:
      - campaign-manager

volumes:
  caddy_data:
  caddy_config:
  mongo_data:

networks:
  internal:
    driver: bridge
