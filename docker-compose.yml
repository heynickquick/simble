services:
  # Simble sms-relay (our own, no FCM/Firebase)
  sms-relay:
    build: ./services/sms-relay
    restart: unless-stopped
    env_file: ./services/sms-relay/.env
    networks: [internal]
    depends_on:
      - mongodb
    ports:
      - "4010:4010"  # host:4010 → sms-relay:4010
    expose:
      - "4010"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    networks: [internal]
    expose:
      - "27017"

  campaign-manager:
    build: ./services/campaign-manager
    restart: unless-stopped
    env_file: ./services/campaign-manager/.env
    networks: [internal]
    depends_on:
      - mongodb
      - sms-relay
    ports:
      - "4000:4000"  # Direct access for testing. Use nginx for prod.
    expose:
      - "4000"

  web:
    build: ./web
    restart: unless-stopped
    networks: [internal]
    ports:
      - "8880:8080"  # Direct access for testing without a domain. Use Caddy for prod.
    expose:
      - "8080"

  watchdog:
    build: ./services/watchdog
    restart: unless-stopped
    env_file: ./services/watchdog/.env
    networks: [internal]
    depends_on:
      - campaign-manager

volumes:
  caddy_data:
  caddy_config:
  mongo_data:

networks:
  internal:
    driver: bridge
