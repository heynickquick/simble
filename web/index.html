<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simble</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">
  <div class="loading">Loading Simble…</div>
</div>

<template id="main-tpl">
  <!-- LOGIN VIEW -->
  <div v-if="view==='login'" class="login-wrap">
    <form class="card login-card" @submit="login">
      <h1 class="brand">Simble</h1>
      <p class="muted">Sign in to your account</p>
      <label>Email <input type="email" v-model="email" required autocomplete="username" /></label>
      <label>Password <input type="password" v-model="password" required autocomplete="current-password" /></label>
      <button type="submit" :disabled="busy">{{ busy ? 'Signing in…' : 'Sign in' }}</button>
      <p class="error" v-if="err">{{ err }}</p>
      <pre v-if="debug" style="font-size:11px;background:#f5f5f5;padding:8px;border-radius:4px;margin-top:12px;white-space:pre-wrap;word-break:break-all;color:#333">{{ debug }}</pre>
      <p class="muted small">Need an account? <a href="#" @click.prevent="showSignup=!showSignup">{{ showSignup ? 'Sign in instead' : 'Create one' }}</a></p>
      <div v-if="showSignup" class="signup">
        <label>Name <input v-model="suName" required /></label>
        <label>Device ID <input v-model="suDevice" required placeholder="textbee device id" /></label>
        <button type="button" @click="signup" :disabled="busy">{{ busy ? 'Creating…' : 'Create account' }}</button>
        <p class="error" v-if="suErr">{{ suErr }}</p>
      </div>
    </form>
  </div>

  <!-- APP VIEW -->
  <div v-else-if="view==='app' && me" class="layout">
    <header class="topbar">
      <div class="brand">Simble</div>
      <nav>
        <a href="#" :class="{active: tab==='dashboard'}" @click.prevent="tab='dashboard'">Dashboard</a>
        <a href="#" :class="{active: tab==='contacts'}" @click.prevent="tab='contacts'">Contacts</a>
        <a href="#" :class="{active: tab==='campaigns'}" @click.prevent="tab='campaigns'">Campaigns</a>
        <a href="#" :class="{active: tab==='settings'}" @click.prevent="tab='settings'">Settings</a>
      </nav>
      <div class="who">
        <span class="muted small">{{ me.email }}</span>
        <button class="link" @click="logout">Sign out</button>
      </div>
    </header>

    <main>
      <section v-if="tab==='dashboard'">
        <h2>Welcome, {{ me.name }}</h2>
        <div class="grid">
          <div class="card stat"><div class="num">{{ stats.contacts }}</div><div class="lbl">Contacts</div></div>
          <div class="card stat"><div class="num">{{ stats.campaigns }}</div><div class="lbl">Campaigns</div></div>
          <div class="card stat"><div class="num">{{ me.usage.smsThisMonth }} / {{ me.limits.smsPerMonth }}</div><div class="lbl">SMS this month</div></div>
          <div class="card stat"><div class="num">{{ me.plan }}</div><div class="lbl">Plan</div></div>
        </div>
      </section>

      <section v-if="tab==='contacts'">
        <div class="row between">
          <h2>Contacts</h2>
          <div>
            <button @click="showCsv=!showCsv">{{ showCsv ? 'Cancel' : 'Import CSV' }}</button>
          </div>
        </div>
        <div v-if="showCsv" class="card csv">
          <p class="muted small">CSV columns: <code>phone,firstName,lastName</code> (any extra columns saved as custom fields)</p>
          <textarea v-model="csvText" rows="6" placeholder="phone,firstName,lastName&#10;+15551234567,Alice,Smith&#10;+15559876543,Bob,Jones"></textarea>
          <button @click="importCsv" :disabled="busy">Import</button>
          <span v-if="csvResult" class="muted small">{{ csvResult }}</span>
        </div>
        <div class="card">
          <input v-model="contactQuery" placeholder="Search phone…" @input="loadContacts" />
          <table>
            <thead><tr><th>Phone</th><th>Name</th><th>Created</th></tr></thead>
            <tbody>
              <tr v-for="c in contacts" :key="c._id">
                <td>{{ c.phone }}</td>
                <td>{{ c.firstName }} {{ c.lastName }}</td>
                <td class="muted small">{{ new Date(c.createdAt).toLocaleString() }}</td>
              </tr>
              <tr v-if="!contacts.length"><td colspan="3" class="muted">No contacts yet. Import a CSV to get started.</td></tr>
            </tbody>
          </table>
          <div class="row between">
            <button :disabled="page===0" @click="page--;loadContacts()">Prev</button>
            <span class="muted small">Page {{ page+1 }} · {{ contactsTotal }} total</span>
            <button :disabled="(page+1)*50>=contactsTotal" @click="page++;loadContacts()">Next</button>
          </div>
        </div>
      </section>

      <section v-if="tab==='campaigns'">
        <div class="row between">
          <h2>Campaigns</h2>
          <div>
            <button @click="showNew=!showNew">{{ showNew ? 'Cancel' : 'New campaign' }}</button>
          </div>
        </div>
        <div v-if="showNew" class="card">
          <h3>New campaign</h3>
          <label>Name <input v-model="newC.name" required /></label>
          <label>Message (max 1600 chars) <textarea v-model="newC.message" rows="4" maxlength="1600"></textarea></label>
          <label>Throttle (ms between sends) <input type="number" v-model.number="newC.throttleMs" min="500" /></label>
          <div>
            <p class="muted small">Select contacts ({{ selectedContacts.length }} selected):</p>
            <div class="contact-pick">
              <label v-for="c in contacts" :key="c._id" class="check">
                <input type="checkbox" :value="c._id" v-model="selectedContacts" />
                {{ c.phone }} <span class="muted small">{{ c.firstName }} {{ c.lastName }}</span>
              </label>
              <p v-if="!contacts.length" class="muted">No contacts yet. Add some in the Contacts tab.</p>
            </div>
          </div>
          <button @click="createCampaign" :disabled="busy || !selectedContacts.length">{{ busy ? 'Creating…' : 'Create & send' }}</button>
          <p v-if="newErr" class="error">{{ newErr }}</p>
        </div>
        <div class="card">
          <table>
            <thead><tr><th>Name</th><th>Status</th><th>Stats</th><th>Created</th></tr></thead>
            <tbody>
              <tr v-for="c in campaigns" :key="c._id">
                <td>{{ c.name }}</td>
                <td><span :class="'status status-' + c.status">{{ c.status }}</span></td>
                <td class="small">{{ c.stats.queued }}q / {{ c.stats.sent }}s / {{ c.stats.delivered }}d / {{ c.stats.failed }}f</td>
                <td class="muted small">{{ new Date(c.createdAt).toLocaleString() }}</td>
              </tr>
              <tr v-if="!campaigns.length"><td colspan="4" class="muted">No campaigns yet.</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section v-if="tab==='settings'">
        <h2>Settings</h2>
        <div class="card">
          <p><strong>Email:</strong> {{ me.email }}</p>
          <p><strong>Plan:</strong> {{ me.plan }} ({{ me.limits.smsPerMonth }} SMS / month)</p>
          <p><strong>Device ID:</strong> <code>{{ me.deviceId }}</code></p>
          <p class="muted small">To change plan or device, contact your account admin.</p>
        </div>
      </section>
    </main>
  </div>

  <div v-else class="loading">Loading…</div>
</template>

<script src="/app.js?v=2" type="module"></script>
</body>
</html>
